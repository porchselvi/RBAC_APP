server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/rbac;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

app:
  jwt:
    # Override in production with a randomly generated secret of at least 32 characters.
    secret: ${JWT_SECRET:local-development-only-secret-change-before-deploy-123456}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  bootstrap-admin:
    name: ${ADMIN_NAME:RBAC Administrator}
    email: ${ADMIN_EMAIL:admin@company.com}
    password: ${ADMIN_PASSWORD:ChangeMe123!}
